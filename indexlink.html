<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- CETTE BALISE EST CRUCIALE POUR LE MOBILE -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jefhiplink/ - Hub Digital</title>
    <style>
        /* RESET & MOBILE FIRST */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; /* Taille optimale pour mobile */
        }

        /* PROFIL */
        .profile-section { text-align: center; margin-bottom: 2rem; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); background: #334155; margin: 0 auto 1rem; }

        /* BOUTONS NAVIGATION */
        .nav-btn { display: block; width: 100%; padding: 16px; margin: 12px 0; background: var(--surface); border: 1px solid #334155; color: white; text-align: center; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; }

        /* BOUTIQUE GRID */
        .shop-title { margin: 2rem 0 1rem; padding-left: 10px; border-left: 4px solid var(--primary); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: var(--surface); padding: 10px; border-radius: 12px; text-align: center; }
        .product-img { width: 100%; height: 80px; background: #334155; border-radius: 8px; margin-bottom: 8px; }
        .price { color: var(--primary); font-weight: bold; display: block; margin: 5px 0; }
        
        /* FOOTER FORFAITS */
        .footer-cta { margin-top: 40px; padding-top: 20px; border-top: 1px solid #334155; text-align: center; }
        .tier-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin: 10px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="profile-section">
        <div class="avatar"></div>
        <h1>Nom Entreprise</h1>
    </div>

    <nav>
        <a href="#" class="nav-btn">Site Web Officiel</a>
        <a href="#" class="nav-btn">WhatsApp Pro</a>
    </nav>

    <h2 class="shop-title">Boutique</h2>
    <div class="grid" id="product-root"></div>

    <footer class="footer-cta">
        <h3>Jefhiplink/</h3>
        <p>Mise à niveau :</p>
        <a href="#" class="nav-btn tier-btn">Basic - 9 $</a>
        <a href="#" class="nav-btn tier-btn">Pro - 29 $</a>
        <a href="#" class="nav-btn tier-btn">Elite - 49 $</a>
    </footer>
</div>

<script>
    const products = [
        { name: "Produit 1", price: "19.99 $", link: "#" },
        { name: "Produit 2", price: "29.99 $", link: "#" }
    ];

    const root = document.getElementById('product-root');
    root.innerHTML = products.map(item => `
        <div class="product-card">
            <div class="product-img"></div>
            <div style="font-size:0.8rem;">${item.name}</div>
            <span class="price">${item.price}</span>
            <a href="${item.link}" class="nav-btn" style="padding:8px; margin:5px 0; font-size:0.8rem;">AJOUTER AU PANIER</a>
        </div>
    `).join('');
</script>

</body>
</html>
